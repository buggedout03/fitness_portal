<!DOCTYPE html>
<html>
<head>
  <title>Measurements</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="navbar"></div>

<div class="container">

  <div class="card">
    <h2>Enter Measurements</h2>
    <input id="waist" type="number" step="0.1" placeholder="Waist (cm)">
    <input id="hips" type="number" step="0.1" placeholder="Hips (cm)">
    <input id="neck" type="number" step="0.1" placeholder="Neck (cm)">
    <input id="shoulder" type="number" step="0.1" placeholder="Shoulders (cm)">
    <input id="chest" type="number" step="0.1" placeholder="Chest (cm)">
    <button onclick="submitMeasurements()">Submit</button>
  </div>

  <div class="card">
    <h2>Measurement Trend</h2>

    <label for="metricSelect">Metric:</label>
    <select id="metricSelect" onchange="renderChart()">
      <option value="waist_cm">Waist (cm)</option>
      <option value="hips_cm">Hips (cm)</option>
      <option value="neck_cm">Neck (cm)</option>
      <option value="shoulder_cm">Shoulders (cm)</option>
      <option value="chest_cm">Chest (cm)</option>
    </select>

    <div class="chart-container" style="margin-top:10px;">
      <canvas id="measurementChart"></canvas>
    </div>
  </div>

</div>

<script src="user.js"></script>
<script src="measurements.js"></script>

<script>
fetch("components/navbar.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("navbar").innerHTML = html;
    initUserControls();
  });

</script>
</body>
</html>
